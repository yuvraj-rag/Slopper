<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer Hexagon Frame -->
  <polygon points="200,60 310,123.5 310,250.5 200,314 90,250.5 90,123.5" 
           fill="none" 
           stroke="#1D3B43" 
           stroke-width="12" 
           stroke-linejoin="round" />

  <!-- Perfectly Centered Inner Graphic Group -->
  <g transform="translate(200, 187)">
    <!-- Central S-Curve Stem -->
    <path d="M -16,-42 C 18,-42 18,-10 0,10 C -18,30 -18,62 16,62" 
          fill="none" 
          stroke="#1D3B43" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Leaf 1: Top-Left (Dark Teal) -->
    <path d="M -7,-12 C -38,-12 -56,-36 -56,-50 C -34,-50 -7,-36 -7,-12 Z" 
          fill="#2C5B63" />
    <path d="M -56,-50 C -34,-32 -16,-23 -7,-12" 
          fill="none" 
          stroke="#FDFCF7" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Leaf 2: Top-Right (Claude Warm Orange) -->
    <path d="M 7,-12 C 38,-12 56,-36 56,-50 C 34,-50 7,-36 7,-12 Z" 
          fill="#D96B27" />
    <path d="M 56,-50 C 34,-32 16,-23 7,-12" 
          fill="none" 
          stroke="#FDFCF7" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Leaf 3: Bottom-Left (Sage Green) -->
    <path d="M -7,12 C -38,12 -56,36 -56,50 C -34,50 -7,36 -7,12 Z" 
          fill="#688B58" />
    <path d="M -56,50 C -34,32 -16,23 -7,12" 
          fill="none" 
          stroke="#FDFCF7" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Leaf 4: Bottom-Right (Muted Teal) -->
    <path d="M 7,12 C 38,12 56,36 56,50 C 34,50 7,36 7,12 Z" 
          fill="#3B707A" />
    <path d="M 56,50 C 34,32 16,23 7,12" 
          fill="none" 
          stroke="#FDFCF7" 
          stroke-width="2.5" 
          stroke-linecap="round" />
  </g>
</svg>
